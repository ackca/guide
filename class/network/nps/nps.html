	<div class="container-fluid">

				createInstruT0("安装NPS", "i1");

							"<div class='divConfigImgT1'>" +

							"</div>"

					createConfigImgT0("i2$1");

					createConfigImgT0("i3$1~14");

				createInstruT0("配置测试连通性的策略", "i4");
					createConfigImgT0("i4$1~15");

					createInstruT1("基于组", "i5-1");
						createConfigImgT1("i5$0");
						createConfigImgT1("i5_1$1");
						createConfigImgT1("i4$4~7");
						createConfigImgT1("i5_1$8");

					createInstruT1("基于SSID", "i5-2");
						createInstruAllTopT1("属性值为 .*:“SSID。，如：.*:itachi-PEAP，itachi-PEAP 为SSID");

						createInstruAllTopT1("配置属性值的依据在windows日志");

						createConfigImgT1("i5_3$1~4");

						createConfigImgT1("i6_1$1~13");

					createInstruT1("授权ACL，ACL位置无线控制器", "i6-2");
